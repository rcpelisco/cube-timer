<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="description" content="Speedcubing timer with scrambles, inspection and averages." />
    <!-- iOS home-screen app: full screen, content runs under a translucent status bar -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Cube Timer" />
    <meta name="theme-color" content="#eceff3" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0d1116" media="(prefers-color-scheme: dark)" />
    <title>Cube Timer</title>
    <script>
      // Apply a forced Light/Dark theme, pure black and the accent colour before first paint
      // (see src/lib/theme.ts and src/lib/accent.ts).
      try {
        var root = document.documentElement;
        var t = localStorage.getItem("cubeTimer.theme");
        if (t === "light" || t === "dark") root.setAttribute("data-theme", t);
        if (localStorage.getItem("cubeTimer.black") === "1") root.setAttribute("data-black", "");
        var a = (localStorage.getItem("cubeTimer.accentVars") || "").split(" ");
        if (a.length === 2) { root.style.setProperty("--accent-l", a[0]); root.style.setProperty("--accent-d", a[1]); }
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
